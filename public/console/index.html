<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ark-console-mode" content="public">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ark-console (read-only)</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/cytoscape.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="page">

<header>
<div class="header-bar">
<h1 id="headline">Loading the snapshot.</h1>
<div class="header-controls">
<button type="button" id="theme-toggle"></button>
<button type="button" id="refresh-button" aria-label="Refresh now">⟳</button>
</div>
</div>
<p id="status"></p>
</header>
<p id="errors" role="alert" hidden></p>

<div class="columns">

<section class="column column-attention" aria-labelledby="attention-eyebrow">
<h2 id="attention-eyebrow" class="eyebrow">Attention</h2>
<p id="waiting-empty" class="empty-state" hidden>Nothing is waiting on you.</p>
<div id="waiting" class="attention-cards"></div>
<div class="running-strip">
<p id="running-empty" class="empty-state" hidden>Nothing is running.</p>
<ul id="running-rows"></ul>
<button type="button" id="running-show-all" hidden></button>
</div>
</section>

<section class="column column-usage" aria-labelledby="usage-eyebrow">
<h2 id="usage-eyebrow" class="eyebrow">Usage</h2>
<div class="stat-tiles">
<div class="stat-tile" data-tile="tokens-24h"></div>
<div class="stat-tile" data-tile="above-150k"></div>
<div class="stat-tile" data-tile="general-purpose-share"></div>
</div>
<div id="chart-tokens-per-day"></div>
</section>

</div>

<div class="tabs">
<div role="tablist" aria-label="Sections" class="tab-bar">
<button type="button" role="tab" id="tab-sessions" aria-controls="panel-sessions" aria-selected="true">Sessions</button>
<button type="button" role="tab" id="tab-repos" aria-controls="panel-repos" aria-selected="false">Repos</button>
<button type="button" role="tab" id="tab-skills" aria-controls="panel-skills" aria-selected="false">Skills</button>
<button type="button" role="tab" id="tab-usage" aria-controls="panel-usage" aria-selected="false">Usage</button>
</div>
<div class="tab-body">

<div role="tabpanel" id="panel-sessions" aria-labelledby="tab-sessions">
<table id="sessions">
<thead>
<tr><th></th><th>Project</th><th>Branch</th><th>Model</th><th>State</th><th>Last activity</th><th>Last tool</th><th class="count">Queued</th><th></th></tr>
</thead>
<tbody></tbody>
</table>
<p><button type="button" id="older-toggle" hidden></button></p>
<p id="sessions-empty" hidden>No sessions found.</p>

<section id="problems-section" hidden>
<h2>Not matched or not read</h2>
<ul id="problems"></ul>
</section>
</div>

<div role="tabpanel" id="panel-repos" aria-labelledby="tab-repos" hidden>
<table id="repos">
<thead>
<tr><th>Repo</th><th>Branch</th><th>Dirty</th><th class="count">Behind</th><th class="count">Ahead</th></tr>
</thead>
<tbody></tbody>
</table>
<p id="repos-empty" hidden>No repos found.</p>
</div>

<div role="tabpanel" id="panel-skills" aria-labelledby="tab-skills" hidden>
<div class="chart-card" id="skills-graph-card">
<h3 class="chart-title">Skills graph</h3>
<div id="skills-graph"></div>
</div>
<div id="chart-skills-used-tab"></div>
</div>

<div role="tabpanel" id="panel-usage" aria-labelledby="tab-usage" hidden>
<div id="usage-charts"></div>
<div id="usage"></div>
</div>

</div>
</div>



</div>
</body>
</html>
